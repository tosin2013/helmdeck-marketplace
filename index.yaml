# helmdeck marketplace catalog
#
# This file is the entry point the helmdeck control plane reads at
# startup (and on POST /api/v1/marketplace/refresh) to enumerate the
# pack catalog without walking every directory under packs/.
#
# Validate locally before opening a PR:
#   ajv validate -s schemas/index.schema.json -d index.yaml
#
# Each entry must agree with packs/<name>/helmdeck-pack.yaml on name +
# version — the validate.yml workflow enforces this on every PR.

catalog_version: v1

packs:
  - name: cmd.upper
    version: v1
    path: packs/cmd.upper
    description: Uppercase a string. Smallest possible example pack.
    author: tosin2013
    category: developer-tools
    tags: [example, string, demo]

  - name: cmd.lower
    version: v1
    path: packs/cmd.lower
    description: Lowercase a string. Sibling of cmd.upper.
    author: tosin2013
    category: developer-tools
    tags: [example, string, demo]

  - name: cmd.wordcount
    version: v1
    path: packs/cmd.wordcount
    description: Count lines, words, and characters in a string. Multi-field output example.
    author: tosin2013
    category: developer-tools
    tags: [example, string, analytics, demo]
