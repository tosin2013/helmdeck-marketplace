name: validate

# Runs on every PR + every push to main. Validates:
#   1. index.yaml conforms to schemas/index.schema.json
#   2. Every packs/<name>/helmdeck-pack.yaml conforms to schemas/helmdeck-pack.schema.json
#   3. Every index.yaml entry has a matching packs/<name>/helmdeck-pack.yaml (and vice versa)
#   4. name + version in index.yaml entries agree with the manifest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schemas:
    name: schema validation (index + per-pack manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install validators LOCALLY (not globally) so `node` can resolve
      # `require('js-yaml')` and `require('ajv')` against the repo's
      # node_modules. Global installs end up in a path node -e doesn't
      # search by default — the previous version of this workflow used
      # -g and failed with "Cannot find module 'js-yaml'".
      - name: Install validators
        run: |
          # ajv 8+ ships draft 2020-12 support which our schemas declare.
          npm install --no-save --silent ajv@^8 ajv-formats@^3 js-yaml@^4

      - name: Validate index.yaml + every pack manifest
        run: |
          node ./.github/workflows/validate.mjs
